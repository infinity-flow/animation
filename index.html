<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Strands</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Parametri (lako podesivi) ----------
const CONFIG = {
  tiltDeg: 16,            // nagib ose: vrh se naginje ulevo
  flowSpeed: 0.09,        // brzina kretanja cestica nagore (duz linije)
  speedVariety: 0.55,     // razlika u brzini izmedju cestica (prestizu jedna drugu)
  twistSpeed: 0.22,       // koliko se sam oblik okrece (malo - kretanje nose cestice)
  orbitSpeed: 1.6,        // koliko brzo cestice kruze unutar linije
  wander: 0.07,           // slobodno lutanje svake cestice
  pathDrift: 0.35,        // koliko se putanja linija polako menja u vremenu
  // Zalutale cestice: pojave se 200-300px od linija i vrate se nazad u tok
  strayPerStrand: 1500,   // broj takvih cestica po liniji
  strayLifeMin: 5,        // najkraci ciklus (sekunde): pojava -> povratak u tok
  strayLifeMax: 10,       // najduzi ciklus
  strayDistMin: 200,      // najmanja udaljenost od linija (px)
  strayDistMax: 300,      // najveca udaljenost od linija (px)
  strayColor: '#7DB8F2',  // svetlo plava za sve zalutale cestice
  blueShare: 0.62,        // udeo plavih cestica (ostalo tamne) - boje su izmesane
  particlesPerStrand: 24000,
  thickness: 0.2,         // debljina linije
  coreHollow: 0.35,       // koliko je centar linije redji (0 = pun, 1 = skoro prazan)
  length: 12,             // duzina linija (prelaze ivice ekrana)
  background: '#ffffff',  // boja pozadine
  // Shader efekat preko cele slike (0 = iskljuceno)
  fxWarp: 1.0,            // tecno talasanje slike
  fxGlow: 0.45,           // mekani sjaj / oreol oko cestica
  fxChroma: 1.0,          // prelivanje boja (RGB pomak) ka ivicama
  fxGrain: 0.035,         // filmsko zrno
  fxRipple: 1.0,          // talasi oko misa
  fxVignette: 0.12,       // blago zatamnjenje uglova
  blue: '#106ACA',
  dark: '#14171A',
  // Mis: rasipanje cestica
  mouseRadius: 1.4,       // koliko daleko od kursora cestice beze
  mouseStrength: 2.6,     // koliko daleko odlecu
  mouseRecover: 1.6,      // brzina vracanja u liniju (vise = brze)
};

// 4 linije, svaka svoja (asimetricno):
// r  = poluprecnik oko ose, f = koliko je gusto uvrnuta, ph = pocetni ugao,
// spin = sopstvena brzina uvijanja, ra/rk = kako se poluprecnik menja duz linije,
// wa/wk = sopstveno vijuganje linije, thick = debljina
const STRANDS = [
  { r: 0.85, f: 1.05, ph: 0.0, spin: 1.00, ra: 0.35, rk: 0.55, wa: 0.18, wk: 0.70, thick: 1.15 },
  { r: 0.55, f: 1.30, ph: 2.1, spin: 1.12, ra: 0.45, rk: 0.80, wa: 0.25, wk: 0.45, thick: 0.85 },
  { r: 1.05, f: 0.85, ph: 3.6, spin: 0.90, ra: 0.25, rk: 0.40, wa: 0.15, wk: 0.95, thick: 1.0 },
  { r: 0.40, f: 1.45, ph: 5.0, spin: 1.20, ra: 0.55, rk: 1.10, wa: 0.30, wk: 0.60, thick: 0.75 },
];

const params = new URLSearchParams(location.search);
const STILL = params.has('t');           // ?t=12 -> staticni kadar
const fixedTime = parseFloat(params.get('t')) || 0;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: STILL });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// scena se crta u sRGB vrednostima (zbog efekta), pa i pozadina mora biti u sRGB
renderer.setClearColor(new THREE.Color(CONFIG.background).convertLinearToSRGB(), 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 10);

// Osa preplitanja
const tilt = THREE.MathUtils.degToRad(CONFIG.tiltDeg);
const dir = new THREE.Vector3(-Math.sin(tilt), Math.cos(tilt), 0);
const uAxis = new THREE.Vector3(Math.cos(tilt), Math.sin(tilt), 0);
const wAxis = new THREE.Vector3(0, 0, 1);

// nasumicne vrednosti sa fiksnim seed-om: cestice izgledaju isto pri svakom ucitavanju
let seed = 1369;
const rand = () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

const gauss = () => {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};

const perStrand = CONFIG.particlesPerStrand + CONFIG.strayPerStrand;
const total = STRANDS.length * perStrand;
const aS = new Float32Array(total);
const aStA = new Float32Array(total * 4);
const aStB = new Float32Array(total * 4);
const aOrb = new Float32Array(total * 4);
const aRand = new Float32Array(total * 4);
const aSize = new Float32Array(total);
const aSpeed = new Float32Array(total);
const aColor = new Float32Array(total * 3);
const aStray = new Float32Array(total * 4);   // jeste zalutala, ciklus, faza, seed

let i = 0;
STRANDS.forEach((st) => {
  const blue = new THREE.Color(CONFIG.blue), dark = new THREE.Color(CONFIG.dark);
  for (let k = 0; k < perStrand; k++, i++) {
    aS[i] = rand();
    aStA.set([st.r, st.f, st.ph, st.spin], i * 4);
    aStB.set([st.ra, st.rk, st.wa, st.wk], i * 4);
    // cestice su rasporedjene kao cev: vise ka ivicama, redje u samom centru linije
    const spread = CONFIG.thickness * st.thick * (rand() < 0.06 ? 1.8 : 1.0);
    const rad = spread * (CONFIG.coreHollow + (1 - CONFIG.coreHollow) * Math.sqrt(rand()));
    // svaka cestica kruzi oko centra linije svojim uglom i brzinom (spiralna putanja)
    const orbit = (rand() < 0.5 ? -1 : 1) * (0.3 + rand()) * CONFIG.orbitSpeed;
    aOrb.set([rand() * Math.PI * 2, orbit, rad, rand() * 100], i * 4);
    // nasumican pravac za rasipanje
    const v = new THREE.Vector3(gauss(), gauss(), gauss()).normalize();
    aRand.set([v.x, v.y, v.z, 0.4 + rand() * 1.2], i * 4);
    aSize[i] = 0.6 + rand() * rand() * 1.8;
    aSpeed[i] = 1 + (rand() * 2 - 1) * CONFIG.speedVariety;
    const c = (rand() < CONFIG.blueShare ? blue : dark).clone()
      .offsetHSL(0, 0, (rand() - 0.5) * 0.08);
    aColor.set([c.r, c.g, c.b], i * 3);
    if (k >= CONFIG.particlesPerStrand) {
      const sc = new THREE.Color(CONFIG.strayColor);
      aColor.set([sc.r, sc.g, sc.b], i * 3);
      const life = CONFIG.strayLifeMin + rand() * (CONFIG.strayLifeMax - CONFIG.strayLifeMin);
      aStray.set([1, life, rand(), rand() * 1000], i * 4);
    }
  }
});

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(total * 3), 3));
geo.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
geo.setAttribute('aStA', new THREE.BufferAttribute(aStA, 4));
geo.setAttribute('aStB', new THREE.BufferAttribute(aStB, 4));
geo.setAttribute('aOrb', new THREE.BufferAttribute(aOrb, 4));
geo.setAttribute('aRand', new THREE.BufferAttribute(aRand, 4));
geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
geo.setAttribute('aSpeed', new THREE.BufferAttribute(aSpeed, 1));
geo.setAttribute('aColor', new THREE.BufferAttribute(aColor, 3));
geo.setAttribute('aStray', new THREE.BufferAttribute(aStray, 4));

const mat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: true,
  uniforms: {
    uTime: { value: 0 },
    uLen: { value: CONFIG.length },
    uFlow: { value: CONFIG.flowSpeed },
    uTwist: { value: CONFIG.twistSpeed },
    uWander: { value: CONFIG.wander },
    uDrift: { value: CONFIG.pathDrift },
    uCenter: { value: new THREE.Vector3() },
    uDir: { value: dir },
    uU: { value: uAxis },
    uW: { value: wAxis },
    uPx: { value: 1 },
    uMouse: { value: new THREE.Vector3(999, 999, 0) },
    uHalf: { value: new THREE.Vector2(5, 3) },
    uPxWorld: { value: 0.01 },
    uBg: { value: new THREE.Color(CONFIG.background) },
    uStrayDist: { value: new THREE.Vector2(CONFIG.strayDistMin, CONFIG.strayDistMax) },
    uForce: { value: 0 },
    uMouseR: { value: CONFIG.mouseRadius },
    uMouseS: { value: CONFIG.mouseStrength },
  },
  vertexShader: /* glsl */`
    attribute float aS; attribute vec4 aStA; attribute vec4 aStB; attribute vec4 aOrb; attribute vec4 aRand;
    attribute float aSize; attribute float aSpeed; attribute vec3 aColor; attribute vec4 aStray;
    uniform vec3 uBg;
    uniform vec2 uHalf, uStrayDist; uniform float uPxWorld;
    vec3 hash3(vec2 q) {
      return fract(sin(vec3(dot(q, vec2(127.1, 311.7)), dot(q, vec2(269.5, 183.3)), dot(q, vec2(419.2, 371.9)))) * 43758.5453);
    }
    uniform float uTime, uLen, uFlow, uTwist, uWander, uDrift, uPx, uForce, uMouseR, uMouseS;
    uniform vec3 uCenter, uDir, uU, uW, uMouse;
    varying vec3 vColor; varying float vAlpha;
    void main() {
      float t = fract(aS + uTime * uFlow * aSpeed);          // tok nagore
      float s = (t - 0.5) * uLen;
      // svaka linija ima svoj ugao, gustinu i brzinu uvijanja
      float th = aStA.y * s + aStA.z - uTime * uTwist * aStA.w;
      // poluprecnik se menja duz linije (ne pulsira u vremenu)
      float r = aStA.x * (1.0 + aStB.x * sin(aStB.y * s + aStA.z * 1.7));
      // sopstveno vijuganje linije, nezavisno od ostalih
      // putanja linije se polako menja u vremenu - linije nisu unapred odredjene
      float wob = aStB.z * sin(aStB.w * s + aStA.z * 2.3 + uTime * uDrift)
                + 0.12 * sin(0.37 * s - uTime * uDrift * 1.3 + aStA.z * 4.1);
      vec3 center = uCenter + uDir * s + uU * wob + r * (cos(th) * uU + sin(th) * uW);
      // cestica kruzi oko centra linije svojom brzinom i luta
      float a = aOrb.x + uTime * aOrb.y + s * 0.8;
      vec3 orbit = aOrb.z * (cos(a) * uU + sin(a) * uW);
      float n = aOrb.w;
      vec3 wander = uWander * vec3(sin(uTime * 1.3 + n + s * 2.1),
                                   sin(uTime * 0.9 + n * 1.7),
                                   sin(uTime * 1.1 + n * 2.3 + s * 1.7));
      vec3 p = center + orbit + wander;

      // zalutale cestice: pojave se na nasumicnom mestu na strani, pa ih tok povuce nazad
      float strayAlpha = 1.0, merge = 1.0;
      if (aStray.x > 0.5) {
        float c = uTime / aStray.y + aStray.z;
        float u = fract(c);
        vec3 h = hash3(vec2(aStray.w, floor(c)));
        // pojavi se 200-300px levo ili desno od svoje linije
        float dist = mix(uStrayDist.x, uStrayDist.y, h.x) * uPxWorld;
        float side = h.y < 0.5 ? -1.0 : 1.0;
        float ang = (h.z - 0.5) * 1.1;                          // malo gore/dole od bocnog pravca
        vec3 off = dist * (side * cos(ang) * uU + sin(ang) * uDir);
        off += 0.05 * vec3(sin(uTime * 0.8 + aStray.w), cos(uTime * 0.7 + aStray.w * 1.3), 0.0);
        float g = smoothstep(0.12, 0.9, u);
        merge = g * g;                                        // polako krene, pa ubrza u tok
        vec3 arc = uDir * sin(merge * 3.14159) * (h.z - 0.5) * dist * 0.6;  // blago zakrivljen let
        p = p + off * (1.0 - merge) + arc;
        strayAlpha = smoothstep(0.0, 0.1, u) * smoothstep(1.0, 0.93, u);
      }

      // rasipanje oko kursora
      vec2 d = p.xy - uMouse.xy;
      float fall = exp(-dot(d, d) / (uMouseR * uMouseR));
      vec3 away = normalize(vec3(d, 0.0) + aRand.xyz * 0.9 + 1e-4);
      p += away * fall * uForce * uMouseS * aRand.w;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float depth = sin(th);                                   // -1 pozadi, +1 napred
      gl_PointSize = aSize * uPx * (1.0 + 0.3 * depth) * (10.0 / -mv.z);
      vColor = mix(aColor, uBg, 0.15 * (1.0 - depth) * 0.5);   // zadnje se gube u pozadini
      float ends = smoothstep(0.0, 0.06, t) * smoothstep(1.0, 0.94, t);
      vAlpha = (0.78 + 0.22 * depth) * mix(1.0, ends, merge) * strayAlpha;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.2, d) * vAlpha;
      if (a < 0.08) discard;
      // boje se kodiraju u sRGB ovde, pa se mesanje radi isto kao bez efekta
      vec3 srgb = mix(vColor * 12.92, 1.055 * pow(vColor, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, vColor));
      gl_FragColor = vec4(srgb, a);
    }`,
});

const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

// ---------- Shader efekat preko cele slike (post-processing) ----------
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const fxScene = new THREE.Scene();
const fxCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fx = new THREE.ShaderMaterial({
  depthTest: false,
  depthWrite: false,
  uniforms: {
    tScene: { value: rt.texture },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uMouseUV: { value: new THREE.Vector2(-1, -1) },
    uForce: { value: 0 },
    uWarp: { value: CONFIG.fxWarp },
    uGlow: { value: CONFIG.fxGlow },
    uChroma: { value: CONFIG.fxChroma },
    uGrain: { value: CONFIG.fxGrain },
    uRipple: { value: CONFIG.fxRipple },
    uVignette: { value: CONFIG.fxVignette },
    uBgS: { value: new THREE.Color().setStyle(CONFIG.background, THREE.SRGBColorSpace).convertLinearToSRGB() },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene;
    uniform vec2 uRes, uMouseUV;
    uniform vec3 uBgS;
    uniform float uTime, uForce, uWarp, uGlow, uChroma, uGrain, uRipple, uVignette;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec2 uv = vUv;
      float aspect = uRes.x / uRes.y;
      // tecno talasanje
      uv += uWarp * 0.0022 * vec2(sin(uv.y * 11.0 + uTime * 1.1) + sin(uv.y * 23.0 - uTime * 0.7) * 0.5,
                                  cos(uv.x * 9.0 - uTime * 0.9) + cos(uv.x * 19.0 + uTime * 1.3) * 0.5);
      // talasi oko misa
      vec2 dm = (uv - uMouseUV) * vec2(aspect, 1.0);
      float d = length(dm);
      uv += uRipple * normalize(dm + 1e-5) / vec2(aspect, 1.0)
            * sin(d * 70.0 - uTime * 9.0) * exp(-d * 7.0) * uForce * 0.006;
      // RGB pomak, jaci ka ivicama
      vec2 dir = (uv - 0.5);
      vec2 ca = dir * uChroma * 0.0016 * smoothstep(0.15, 0.7, length(dir));
      vec3 col = vec3(texture2D(tScene, uv + ca).r, texture2D(tScene, uv).g, texture2D(tScene, uv - ca).b);
      // van ivica slike (zbog talasanja) prikazi boju pozadine, bez razvucenih traka
      vec2 inb = step(vec2(0.0), uv) * step(uv, vec2(1.0));
      col = mix(uBgS, col, inb.x * inb.y);
      // mekani sjaj: zamucena slika pomnozena preko (na beloj pozadini daje plavi oreol)
      vec3 blur = vec3(0.0);
      vec2 px = 1.0 / uRes;
      for (int i = 0; i < 12; i++) {
        float a = float(i) * 0.5236;
        blur += texture2D(tScene, uv + vec2(cos(a), sin(a)) * px * 9.0).rgb;
        blur += texture2D(tScene, uv + vec2(cos(a + 0.26), sin(a + 0.26)) * px * 20.0).rgb;
      }
      blur /= 24.0;
      col *= mix(vec3(1.0), blur, uGlow);
      // vinjeta i zrno
      col *= 1.0 - uVignette * smoothstep(0.35, 0.95, length(dir * vec2(aspect * 0.75, 1.0)));
      col += (hash(vUv * uRes + fract(uTime) * 100.0) - 0.5) * uGrain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`,
});
fxScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fx));

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  const pr = renderer.getPixelRatio();
  rt.setSize(Math.round(w * pr), Math.round(h * pr));
  fx.uniforms.uRes.value.set(w * pr, h * pr);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const visH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visW = visH * camera.aspect;
  mat.uniforms.uCenter.value.set(camera.aspect > 1.2 ? visW * 0.2 : 0, 0, 0);
  mat.uniforms.uHalf.value.set(visW / 2, visH / 2);
  mat.uniforms.uPxWorld.value = visH / h;
  mat.uniforms.uPx.value = renderer.getPixelRatio() * Math.max(1.4, h / 540);
}
addEventListener('resize', resize);
resize();

// ---------- Mis / dodir ----------
const ray = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const ndc = new THREE.Vector2();
const target = new THREE.Vector3(999, 999, 0);
let energy = 0, lastX = null, lastY = null;

function onPointer(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  ray.ray.intersectPlane(plane, target);
  if (lastX !== null) {
    const speed = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    energy = Math.min(1, energy + speed / 120);
  }
  lastX = e.clientX; lastY = e.clientY;
  fx.uniforms.uMouseUV.value.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
}
addEventListener('pointermove', onPointer);
addEventListener('pointerdown', (e) => { onPointer(e); energy = 1; });
document.addEventListener('pointerleave', () => { lastX = lastY = null; });

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
let force = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const u = mat.uniforms;
  u.uTime.value = STILL ? fixedTime : u.uTime.value + dt * (reduced ? 0.2 : 1);
  // sila brzo raste dok se mis pomera, pa se polako vraca na 0
  force += (energy - force) * Math.min(1, dt * 8);
  energy *= Math.exp(-dt * CONFIG.mouseRecover);
  u.uForce.value = force;
  u.uMouse.value.lerp(target, Math.min(1, dt * 12));
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  fx.uniforms.uTime.value = u.uTime.value;
  fx.uniforms.uForce.value = force;
  renderer.render(fxScene, fxCam);
  if (!STILL) requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
