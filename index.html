<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Strands</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Parametri (lako podesivi) ----------
const CONFIG = {
  tiltDeg: 16,            // nagib ose: vrh se naginje ulevo
  flowSpeed: 0.04,        // brzina kretanja cestica nagore
  twistSpeed: 0.9,        // brzina uvijanja linija jedna oko druge
  blueShare: 0.62,        // udeo plavih cestica (ostalo tamne) - boje su izmesane
  particlesPerStrand: 20000,
  thickness: 0.085,       // debljina linije
  length: 12,             // duzina linija (prelaze ivice ekrana)
  blue: '#106ACA',
  dark: '#14171A',
  // Mis: rasipanje cestica
  mouseRadius: 1.4,       // koliko daleko od kursora cestice beze
  mouseStrength: 2.6,     // koliko daleko odlecu
  mouseRecover: 1.6,      // brzina vracanja u liniju (vise = brze)
};

// 4 linije, svaka svoja (asimetricno):
// r  = poluprecnik oko ose, f = koliko je gusto uvrnuta, ph = pocetni ugao,
// spin = sopstvena brzina uvijanja, ra/rk = kako se poluprecnik menja duz linije,
// wa/wk = sopstveno vijuganje linije, thick = debljina
const STRANDS = [
  { r: 0.85, f: 1.05, ph: 0.0, spin: 1.00, ra: 0.35, rk: 0.55, wa: 0.18, wk: 0.70, thick: 1.15 },
  { r: 0.55, f: 1.30, ph: 2.1, spin: 1.12, ra: 0.45, rk: 0.80, wa: 0.25, wk: 0.45, thick: 0.85 },
  { r: 1.05, f: 0.85, ph: 3.6, spin: 0.90, ra: 0.25, rk: 0.40, wa: 0.15, wk: 0.95, thick: 1.0 },
  { r: 0.40, f: 1.45, ph: 5.0, spin: 1.20, ra: 0.55, rk: 1.10, wa: 0.30, wk: 0.60, thick: 0.75 },
];

const params = new URLSearchParams(location.search);
const STILL = params.has('t');           // ?t=12 -> staticni kadar
const fixedTime = parseFloat(params.get('t')) || 0;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: STILL });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 10);

// Osa preplitanja
const tilt = THREE.MathUtils.degToRad(CONFIG.tiltDeg);
const dir = new THREE.Vector3(-Math.sin(tilt), Math.cos(tilt), 0);
const uAxis = new THREE.Vector3(Math.cos(tilt), Math.sin(tilt), 0);
const wAxis = new THREE.Vector3(0, 0, 1);

const gauss = () => {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};

const total = STRANDS.length * CONFIG.particlesPerStrand;
const aS = new Float32Array(total);
const aStA = new Float32Array(total * 4);
const aStB = new Float32Array(total * 4);
const aOff = new Float32Array(total * 3);
const aRand = new Float32Array(total * 4);
const aSize = new Float32Array(total);
const aSpeed = new Float32Array(total);
const aColor = new Float32Array(total * 3);

let i = 0;
STRANDS.forEach((st) => {
  const blue = new THREE.Color(CONFIG.blue), dark = new THREE.Color(CONFIG.dark);
  for (let k = 0; k < CONFIG.particlesPerStrand; k++, i++) {
    aS[i] = Math.random();
    aStA.set([st.r, st.f, st.ph, st.spin], i * 4);
    aStB.set([st.ra, st.rk, st.wa, st.wk], i * 4);
    const spread = CONFIG.thickness * st.thick * (Math.random() < 0.07 ? 2.8 : 1.0);
    aOff.set([gauss() * spread, gauss() * spread * 0.6, gauss() * spread], i * 3);
    // nasumican pravac za rasipanje
    const v = new THREE.Vector3(gauss(), gauss(), gauss()).normalize();
    aRand.set([v.x, v.y, v.z, 0.4 + Math.random() * 1.2], i * 4);
    aSize[i] = 0.6 + Math.random() * Math.random() * 1.8;
    aSpeed[i] = 0.85 + Math.random() * 0.3;
    const c = (Math.random() < CONFIG.blueShare ? blue : dark).clone()
      .offsetHSL(0, 0, (Math.random() - 0.5) * 0.08);
    aColor.set([c.r, c.g, c.b], i * 3);
  }
});

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(total * 3), 3));
geo.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
geo.setAttribute('aStA', new THREE.BufferAttribute(aStA, 4));
geo.setAttribute('aStB', new THREE.BufferAttribute(aStB, 4));
geo.setAttribute('aOff', new THREE.BufferAttribute(aOff, 3));
geo.setAttribute('aRand', new THREE.BufferAttribute(aRand, 4));
geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
geo.setAttribute('aSpeed', new THREE.BufferAttribute(aSpeed, 1));
geo.setAttribute('aColor', new THREE.BufferAttribute(aColor, 3));

const mat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: true,
  uniforms: {
    uTime: { value: 0 },
    uLen: { value: CONFIG.length },
    uFlow: { value: CONFIG.flowSpeed },
    uTwist: { value: CONFIG.twistSpeed },
    uCenter: { value: new THREE.Vector3() },
    uDir: { value: dir },
    uU: { value: uAxis },
    uW: { value: wAxis },
    uPx: { value: 1 },
    uMouse: { value: new THREE.Vector3(999, 999, 0) },
    uForce: { value: 0 },
    uMouseR: { value: CONFIG.mouseRadius },
    uMouseS: { value: CONFIG.mouseStrength },
  },
  vertexShader: /* glsl */`
    attribute float aS; attribute vec4 aStA; attribute vec4 aStB; attribute vec3 aOff; attribute vec4 aRand;
    attribute float aSize; attribute float aSpeed; attribute vec3 aColor;
    uniform float uTime, uLen, uFlow, uTwist, uPx, uForce, uMouseR, uMouseS;
    uniform vec3 uCenter, uDir, uU, uW, uMouse;
    varying vec3 vColor; varying float vAlpha;
    void main() {
      float t = fract(aS + uTime * uFlow * aSpeed);          // tok nagore
      float s = (t - 0.5) * uLen;
      // svaka linija ima svoj ugao, gustinu i brzinu uvijanja
      float th = aStA.y * s + aStA.z - uTime * uTwist * aStA.w;
      // poluprecnik se menja duz linije (ne pulsira u vremenu)
      float r = aStA.x * (1.0 + aStB.x * sin(aStB.y * s + aStA.z * 1.7));
      // sopstveno vijuganje linije, nezavisno od ostalih
      float wob = aStB.z * sin(aStB.w * s + aStA.z * 2.3);
      vec3 p = uCenter + uDir * s + uU * wob + r * (cos(th) * uU + sin(th) * uW) + aOff;

      // rasipanje oko kursora
      vec2 d = p.xy - uMouse.xy;
      float fall = exp(-dot(d, d) / (uMouseR * uMouseR));
      vec3 away = normalize(vec3(d, 0.0) + aRand.xyz * 0.9 + 1e-4);
      p += away * fall * uForce * uMouseS * aRand.w;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float depth = sin(th);                                   // -1 pozadi, +1 napred
      gl_PointSize = aSize * uPx * (1.0 + 0.3 * depth) * (10.0 / -mv.z);
      vColor = mix(aColor, vec3(1.0), 0.3 * (1.0 - depth) * 0.5);   // zadnje svetlije
      vAlpha = (0.78 + 0.22 * depth) * smoothstep(0.0, 0.06, t) * smoothstep(1.0, 0.94, t);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.2, d) * vAlpha;
      if (a < 0.08) discard;
      gl_FragColor = vec4(vColor, a);
    }`,
});

const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const visH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visW = visH * camera.aspect;
  mat.uniforms.uCenter.value.set(camera.aspect > 1.2 ? visW * 0.2 : 0, 0, 0);
  mat.uniforms.uPx.value = renderer.getPixelRatio() * Math.max(1.4, h / 540);
}
addEventListener('resize', resize);
resize();

// ---------- Mis / dodir ----------
const ray = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const ndc = new THREE.Vector2();
const target = new THREE.Vector3(999, 999, 0);
let energy = 0, lastX = null, lastY = null;

function onPointer(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  ray.ray.intersectPlane(plane, target);
  if (lastX !== null) {
    const speed = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    energy = Math.min(1, energy + speed / 120);
  }
  lastX = e.clientX; lastY = e.clientY;
}
addEventListener('pointermove', onPointer);
addEventListener('pointerdown', (e) => { onPointer(e); energy = 1; });
document.addEventListener('pointerleave', () => { lastX = lastY = null; });

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
let force = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const u = mat.uniforms;
  u.uTime.value = STILL ? fixedTime : u.uTime.value + dt * (reduced ? 0.2 : 1);
  // sila brzo raste dok se mis pomera, pa se polako vraca na 0
  force += (energy - force) * Math.min(1, dt * 8);
  energy *= Math.exp(-dt * CONFIG.mouseRecover);
  u.uForce.value = force;
  u.uMouse.value.lerp(target, Math.min(1, dt * 12));
  renderer.render(scene, camera);
  if (!STILL) requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
